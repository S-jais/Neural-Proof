version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neural-proof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: neural_proof
      POSTGRES_USER: neural
      POSTGRES_PASSWORD: proof_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neural -d neural_proof"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - neural-network

  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: neural-proof-python
    restart: unless-stopped
    environment:
      APP_ENV: production
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-to-a-random-secret}
      TINYFISH_API_KEY: ${TINYFISH_API_KEY}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      TINYFISH_AGENT_ENABLED: ${TINYFISH_AGENT_ENABLED:-false}
    # Notice: port 8000 is internal-only to prevent unauthorized public access
    expose:
      - "8000"
    networks:
      - neural-network

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: neural-proof-java
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default
      DATABASE_URL: jdbc:postgresql://postgres:5432/neural_proof
      DATABASE_USERNAME: neural
      DATABASE_PASSWORD: proof_secret
      PYTHON_BACKEND_URL: http://backend-python:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-to-a-random-secret}
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    networks:
      - neural-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neural-proof-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    networks:
      - neural-network

volumes:
  postgres_data:

networks:
  neural-network:
    driver: bridge
